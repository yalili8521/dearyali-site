<style>
  :root {
    --bg: #fcfcfc;
    --bg-elevated: #ffffff;
    --ink: #111111;
    --ink-dim: #666666;
    --ink-faint: #a0a0a0;
    --rule: #eaeaea;
    --accent: #000000;
    --nav-bg: rgba(252, 252, 252, 0.85);
    --nav-border: rgba(0,0,0,0.05);
    --radial-bg: rgba(0,0,0,0.01);
    --project-hover: rgba(0,0,0,0.015);
    --status-live-color: #111;
    --status-live-border: rgba(17, 17, 17, 0.4);
    --status-iter-color: #666;
    --status-iter-border: rgba(102, 102, 102, 0.35);
    --status-cold-color: #a0a0a0;
    --status-cold-border: rgba(160, 160, 160, 0.3);
    --svg-stroke-1: #eaeaea;
    --svg-stroke-2: #a0a0a0;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', monospace;
  }

  :root[data-theme="dark"] {
    --bg: #050505;
    --bg-elevated: #111111;
    --ink: #f4f4f5;
    --ink-dim: #a1a1aa;
    --ink-faint: #52525b;
    --rule: #27272a;
    --accent: #ffffff;
    --nav-bg: rgba(5, 5, 5, 0.8);
    --nav-border: rgba(255,255,255,0.05);
    --radial-bg: rgba(255,255,255,0.03);
    --project-hover: rgba(255,255,255,0.02);
    --status-live-color: #fafafa;
    --status-live-border: rgba(250, 250, 250, 0.4);
    --status-iter-color: #a1a1aa;
    --status-iter-border: rgba(161, 161, 170, 0.35);
    --status-cold-color: #52525b;
    --status-cold-border: rgba(82, 82, 91, 0.3);
    --svg-stroke-1: #27272a;
    --svg-stroke-2: #a1a1aa;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; outline-color: var(--ink-faint); }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 300;
    font-size: 17px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::after {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at 50% 0%, var(--bg-elevated) 0%, transparent 70%),
                radial-gradient(circle at 100% 100%, var(--radial-bg) 0%, transparent 50%);
    pointer-events: none;
    z-index: 1;
  }
  
  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px);
    background-size: 60px 60px;
    opacity: 0.15;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes noise-bg {
    0%, 100% { transform: translate(0, 0); }
    10% { transform: translate(-5%, -10%); }
    20% { transform: translate(-15%, 5%); }
    30% { transform: translate(7%, -25%); }
    40% { transform: translate(-5%, 25%); }
    50% { transform: translate(-15%, 10%); }
    60% { transform: translate(15%, 0%); }
    70% { transform: translate(0%, 15%); }
    80% { transform: translate(3%, 35%); }
    90% { transform: translate(-10%, 10%); }
  }

  main, nav { position: relative; z-index: 2; }

  /* ---- Navigation ---- */
  nav {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    padding: 20px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--nav-bg);
    backdrop-filter: blur(12px) saturate(150%);
    -webkit-backdrop-filter: blur(12px) saturate(150%);
    border-bottom: 1px solid var(--nav-border);
    z-index: 100;
  }

  .nav-mark {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 18px;
    letter-spacing: -0.01em;
    font-style: italic;
  }

  .nav-mark span {
    font-style: normal;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 13px;
    margin-left: 8px;
  }

  .nav-links {
    display: flex;
    gap: 28px;
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .nav-links a {
    color: var(--ink-dim);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .nav-links a:hover { color: var(--ink); }


  /* Theme Toggle Button */
  .theme-toggle {
    background: none;
    border: none;
    color: var(--ink-dim);
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
    transition: color 0.2s ease, transform 0.2s ease;
    display: flex;
    align-items: center;
  }
  
  .theme-toggle:hover {
    color: var(--ink);
    transform: rotate(15deg);
  }
  main {
    max-width: 1160px;
    margin: 0 auto;
    padding: 0 64px;
  }

  section {
    padding: 180px 0;
  }

  section:not(:last-child) { border-bottom: 1px solid var(--rule); }

  .section-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 40px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .section-label::before {
    content: '';
    width: 32px;
    height: 1px;
    background: var(--ink-faint);
  }

  /* ---- Hero ---- */
  #hero {
    min-height: 90vh;
    padding-top: 200px;
    padding-bottom: 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .hero-top {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 40px;
    align-items: start;
  }

  .hero-meta {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-faint);
    line-height: 2.2;
    padding-top: 12px;
  }

  .hero-meta-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .hero-meta-row::before {
    content: '';
    width: 4px;
    height: 4px;
    background: var(--accent);
    border-radius: 50%;
  }

  .hero-name {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(72px, 12vw, 160px);
    line-height: 0.95;
    letter-spacing: -0.05em;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.9s 0.2s ease forwards;
  }

  .hero-name em {
    font-style: italic;
    font-weight: 300;
    color: var(--accent);
  }

  .hero-title {
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    margin-bottom: 40px;
    opacity: 0;
    animation: fadeUp 0.9s 0.4s ease forwards;
  }

  .hero-title .sep {
    color: var(--ink-faint);
    margin: 0 10px;
  }

  .hero-pitch {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(24px, 2.8vw, 38px);
    line-height: 1.35;
    max-width: 840px;
    color: var(--ink-dim);
    margin-top: 48px;
    opacity: 0;
    animation: fadeUp 0.9s 0.6s ease forwards;
  }

  .hero-pitch em {
    font-style: italic;
    color: var(--accent);
  }

  .hero-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 40px;
    margin-top: 80px;
  }

  .hero-scroll {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-faint);
    opacity: 0;
    animation: fadeIn 1s 1.2s ease forwards;
  }

  .hero-scroll::after {
    content: '↓';
    display: inline-block;
    margin-left: 8px;
    animation: bounce 2s infinite;
  }

  /* ---- About ---- */
  .about-grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr; /* Stronger asymmetry */
    gap: 140px;
    align-items: start;
  }

  .about-headline {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(32px, 4vw, 48px);
    line-height: 1.1;
    letter-spacing: -0.03em;
    position: sticky;
    top: 120px;
  }

  .about-headline em {
    font-style: italic;
    color: var(--accent);
  }

  .about-body p {
    font-size: 20px;
    line-height: 1.7;
    color: var(--ink);
    margin-bottom: 32px;
    max-width: 52ch;
  }

  .about-body p:last-child { margin-bottom: 0; }

  .about-body .dim { color: var(--ink-dim); }

  /* ---- Services (A2A) ---- */
  .services-hero {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(32px, 4vw, 52px);
    line-height: 1.15;
    letter-spacing: -0.02em;
    max-width: 900px;
    margin-bottom: 60px;
  }

  .services-hero em {
    font-style: italic;
    color: var(--accent);
  }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 48px;
    margin-top: 48px;
  }

  .service-card {
    border-top: 1px solid var(--rule);
    padding-top: 24px;
    transition: border-color 0.3s ease;
  }

  .service-card:hover {
    border-top-color: var(--accent);
  }

  .service-number {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    margin-bottom: 16px;
  }

  .service-title {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 22px;
    line-height: 1.2;
    letter-spacing: -0.01em;
    margin-bottom: 16px;
  }

  .service-desc {
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink-dim);
  }

  .services-cta {
    margin-top: 80px;
    padding: 40px;
    background: var(--bg-elevated);
    border: 1px solid var(--rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 40px;
    flex-wrap: wrap;
  }

  .cta-text {
    font-family: var(--serif);
    font-weight: 300;
    font-size: 20px;
    line-height: 1.4;
    max-width: 520px;
  }

  .cta-button {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 24px;
    background: var(--accent);
    color: var(--bg);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-decoration: none;
    transition: all 0.2s ease;
    border: 1px solid var(--accent);
  }

  .cta-button:hover {
    background: transparent;
    color: var(--accent);
  }

  .cta-button::after {
    content: '→';
    transition: transform 0.2s ease;
  }

  .cta-button:hover::after {
    transform: translateX(4px);
  }

  /* ---- Agent Lab ---- */
  .agentlab-headline {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(32px, 4vw, 52px);
    line-height: 1.15;
    letter-spacing: -0.02em;
    max-width: 900px;
    margin-bottom: 40px;
  }

  .agentlab-intro {
    max-width: 720px;
    margin-bottom: 60px;
  }

  .agentlab-intro p {
    font-size: 18px;
    line-height: 1.7;
    margin-bottom: 24px;
  }

  .agentlab-intro p:last-child { margin-bottom: 0; }
  .agentlab-intro .dim { color: var(--ink-dim); }

  .agent-diagram {
    background: var(--bg-elevated);
    border: 1px solid var(--rule);
    padding: 60px 24px;
    margin: 40px 0 16px;
    overflow-x: auto;
    border-radius: 2px;
  }

  .agent-diagram svg {
    width: 100%;
    height: auto;
    max-width: 1000px;
    display: block;
    margin: 0 auto;
    min-width: 760px;
  }

  .agentlab-caption {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--ink-faint);
    text-align: center;
    max-width: 720px;
    margin: 0 auto 60px;
    line-height: 1.8;
  }

  .agent-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border-top: 1px solid var(--rule);
    margin-top: 24px;
  }

  .agent-row {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 20px;
    padding: 18px 0;
    border-bottom: 1px solid var(--rule);
    align-items: baseline;
  }

  .agent-row:nth-child(odd) {
    padding-right: 32px;
    border-right: 1px solid var(--rule);
  }

  .agent-row:nth-child(even) {
    padding-left: 32px;
  }

  .agent-name {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: 0;
  }

  .agent-role {
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-dim);
  }

  .agentlab-closing {
    margin-top: 60px;
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(18px, 2vw, 22px);
    line-height: 1.5;
    color: var(--ink);
    max-width: 780px;
  }

  .inline-link {
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
    transition: opacity 0.2s ease;
  }

  .inline-link:hover {
    opacity: 0.7;
  }

  /* ---- Ventures intro ---- */
  .ventures-intro {
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(20px, 2.2vw, 26px);
    line-height: 1.45;
    color: var(--ink-dim);
    max-width: 780px;
    margin-bottom: 32px;
  }

  /* ---- Project external link styles ---- */
  .project-link {
    color: var(--ink);
    text-decoration: none;
    transition: color 0.2s ease;
  }

  .project-link:hover {
    color: var(--accent);
  }

  .project-link-arrow {
    display: inline-block;
    font-size: 0.65em;
    vertical-align: 0.25em;
    margin-left: 4px;
    transition: transform 0.2s ease;
  }

  .project-link:hover .project-link-arrow {
    transform: translate(2px, -2px);
  }

  .project-visit {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-dim);
    text-decoration: none;
    transition: color 0.2s ease;
    margin-top: 4px;
  }

  .project-visit:hover {
    color: var(--accent);
  }

    padding: 28px 32px;

  .contact-cta-link:hover {
    opacity: 0.7;
  }

  }

    padding: 64px 0;

    align-items: start;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);

  .project:hover {

    font-size: 12px;
    color: var(--ink-faint);
